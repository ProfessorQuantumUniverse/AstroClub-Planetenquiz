<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeten-Quiz</title>
	<script src="Planetenquiz.js" defer></script>
	<link rel="stylesheet" href="Planetenquiz.css">
</head>
<body>
<div class="container">
    <div class="text-box header-box">
        <div class="lang-switch">
            <label for="langSelect">Sprache / Language:</label>
            <select id="langSelect" aria-label="Language selector">
                <option value="de">Deutsch</option>
                <option value="en">English</option>
            </select>
        </div>
        <img src="AstroClub_logo.jpg" alt="AstroClub Logo" class="logo">
        <h1 id="titleText">Planeten-Quiz</h1>
    </div>
    <form id="quizForm">
        <!-- Reihenfolge: allgemeine Fragen, dann Sortieraufgabe, dann je eine Frage pro Planet -->
        <div id="quizContentGeneral"></div>
        <div id="dragDropContent"></div>
        <div id="quizContentPlanets"></div>
    <input type="button" id="evaluateBtn" class="action-button" value="Quiz auswerten" onclick="checkAnswers()">
    </form>
    <div id="result"></div>
    <div id="antwort"></div>
    <!-- data-online-only: faellt beim Offline-Build weg, dort zeigt der Link auf sich selbst -->
    <p class="offline-hint" data-online-only>
        Kein Internet vor Ort?
        <a href="Planetenquiz-offline.html" download>Quiz als einzelne Datei herunterladen</a>
        – läuft per Doppelklick in jedem Browser, völlig offline.
    </p>
</div>
